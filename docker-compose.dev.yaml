services:
  backend:
    extends:
      file: docker-compose.common.yaml
      service: backend
  frontend:
    extends:
      file: docker-compose.common.yaml
      service: frontend
    build:
      context: Frontend
      dockerfile: Dockerfile
    volumes:
      - ./Frontend:/app:ro
  reverse_proxy:
    extends:
      file: docker-compose.common.yaml
      service: reverse_proxy
    environment:
      - DOUJI_DEV=1
    volumes:
      - ./dev_certs:/etc/ssl/douji:ro